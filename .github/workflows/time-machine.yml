name: time machine (the vintages behind /time-machine/)

# 16 NOVEMBER 2026 (collection 1137; Anthony: "lets build the time machine"). /time-machine/ shows every series as it was known on a
# chosen day. Its data are the published vintages kept by ALFRED; s2/time_machine/tm_build.py pulls them (add-only guard) into
# site/public/time-machine/.
# 22 NOVEMBER 2026 (collection 1162; Anthony: "automatically live updating with the most current vintage forever and always and as fast as it
# possibly can be"). Every update run now brings the vintages itself, in the same deploy (run_cloud.sh: the publisher's release-day vintage,
# then every vintage from ALFRED), so the files have one writer and the second deploy is gone. This workflow is the backstop: after every
# update run, and once a night, it asks ALFRED for anything in force since the files' last pull from it (one small request a series) and, if
# ALFRED has more (FRED posted after the run's pull), starts a site run (update.yml, mode site), which pulls and publishes it. It writes
# nothing. No Mac, no AI.
on:
  workflow_run:
    workflows: ['bristow-hall update']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:

concurrency:
  group: time-machine
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  time-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - name: does ALFRED hold a value the published files lack
        id: check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 data/105_bristow_hall_system_2026-09-08/workspace/s2/time_machine/tm_build.py --check
      # never a loop: no start while an update run is queued or under way (it pulls the vintages itself), and at most three starts by this
      # workflow in an hour (a pull that keeps failing waits for the next release run and the night's check)
      - name: whether to start a site run
        id: guard
        if: steps.check.outputs.newer == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, datetime as dt, urllib.request
          H = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'bhr-time-machine'}
          R = os.environ['GITHUB_REPOSITORY']
          get = lambda u: json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/%s/%s' % (R, u), headers=H), timeout=30))
          go = True
          try:
              runs = get('actions/workflows/update.yml/runs?branch=main&per_page=20')['workflow_runs']
              busy = [r for r in runs if r['status'] != 'completed']
              if busy: go = False; print('an update run is %s: it pulls the vintages itself' % busy[0]['status'], file=sys.stderr)
              since = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=1); n = 0
              for r in get('actions/workflows/time-machine.yml/runs?per_page=30')['workflow_runs']:
                  if str(r['id']) == os.environ.get('GITHUB_RUN_ID') or dt.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00')) < since: continue
                  for j in get('actions/runs/%d/jobs' % r['id'])['jobs']:
                      n += sum(1 for s in j.get('steps', []) if s['name'] == 'start a site run' and s.get('conclusion') == 'success')
              if go and n >= 3: go = False; print('three site runs started by this workflow in the last hour: the next release run and the night check take it', file=sys.stderr)
          except Exception as e:
              print('runs not read (%s): the site run is started' % type(e).__name__, file=sys.stderr)
          # 1167 (25 Nov 2026): NOT IN FRONT OF A RELEASE SLOT. At 8:37 ET this workflow started a site run 41 s after the held 8:31 claims
          # run ended, while the 8:35 slot's run had not been started yet: the slot ran at 8:50, behind it. A site run is not started when a
          # release slot is due in the next 15 minutes, or was due in the last 10 and no update run has started since (that run pulls the
          # vintages itself).
          try:
              from zoneinfo import ZoneInfo
              NY = ZoneInfo('America/New_York'); now = dt.datetime.now(dt.timezone.utc)
              slots = json.load(open('data/105_bristow_hall_system_2026-09-08/site/public/run_slots.json')).get('slots') or []
              last = max([dt.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00')) for r in (runs if 'runs' in dir() else [])] or [now - dt.timedelta(days=1)])
              soon = []
              for x in slots:
                  if not x.get('ny'): continue
                  t = dt.datetime.strptime(x['ny'], '%Y-%m-%d %H:%M').replace(tzinfo=NY).astimezone(dt.timezone.utc); a = (t - now).total_seconds()
                  if 0 <= a <= 900 or (-600 <= a < 0 and last < t - dt.timedelta(seconds=60)): soon.append(x['ny'])
              if go and soon: go = False; print('a release slot is due at %s ET: its run pulls the vintages itself' % min(soon), file=sys.stderr)
          except Exception as e:
              print('the release slots not read (%s): not checked' % type(e).__name__, file=sys.stderr)
          print('go=%s' % ('true' if go else 'false'))
          PY
      - name: start a site run
        if: steps.check.outputs.newer == 'true' && steps.guard.outputs.go == 'true'
        run: |
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=site -f origin=hand
          echo "ALFRED has a newer vintage: a site run is started; it pulls and publishes it"
