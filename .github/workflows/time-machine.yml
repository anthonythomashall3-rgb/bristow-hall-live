name: time machine (the vintages behind /time-machine/)

# 16 NOVEMBER 2026 (collection 1137; Anthony: "lets build the time machine"). /time-machine/ shows every series as it was known on a
# chosen day. Its data are the published vintages kept by ALFRED; s2/time_machine/tm_build.py pulls them (add-only guard) into
# site/public/time-machine/. This runs after every live update (a release slot is when a new vintage appears) and once a night as a
# catch-up; it commits only when a file changed, then starts the site deploy (update.yml, mode site). No Mac, no AI.
on:
  workflow_run:
    workflows: ['bristow-hall update']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:

concurrency:
  group: time-machine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  time-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - name: pull the vintages
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 data/105_bristow_hall_system_2026-09-08/workspace/s2/time_machine/tm_build.py
      - name: commit what changed and deploy
        run: |
          git config user.name "bristow-hall time machine"; git config user.email "noreply@users.noreply.github.com"
          git add -A data/105_bristow_hall_system_2026-09-08/site/public/time-machine
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Time machine: vintages refreshed ($(git diff --cached --name-only | sed -E 's#.*/##' | tr '\n' ' '))"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 20; done
          git fetch -q origin main; [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "not pushed"; exit 1; }
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=site -f origin=hand
