name: live tools (state-onset, stress-map, data page rows, shadow)

# 15 NOVEMBER 2026 (collection 1052; Anthony 08:21 PT: "make it not on the mac but on the github and make sure ALL live tools are updated
# by the github so the mac doesnt need to be on and running"). Until now /state-onset/, /stress-map/, the data page's Mac rows
# (s2/tool_inputs_mac.json) and /shadow/ were rebuilt on the Mac (launchd com.bristowhall.stressmap1052 and com.bristowhall.liveunion823)
# and pushed here. This workflow runs the same scripts on GitHub: the files they read are kept as release assets (ops/live_tools/state.py,
# add-only), restored at the Mac's own paths, refreshed from the publishers (FRED, Philadelphia Fed, BLS API v2, QCEW open data, DOL),
# rebuilt, checked, committed only when every check passes and something changed, deployed by the site workflow (update.yml, mode site)
# and read back from https://bristowhallsystem.pages.dev. Each script in ops/live_tools/ says what it does in its first lines.
on:
  schedule:
    # after the morning releases (BLS 8:30 ET State and county LAUS, State payrolls, CES, QCEW; DOL claims 8:30 ET Thursday; the
    # Philadelphia Fed State indexes) and after the 4 PM ET close (the S&P 500 feed of the shadow tool): the Mac job's 08:45 and 18:15
    # Pacific, in UTC (GitHub ignores daylight saving; in summer these are 09:50 and 19:20 Pacific, still after every release)
    - cron: '50 16 * * *'
    - cron: '20 2 * * *'
    # Thursdays after the DOL weekly claims release (05:30 ET; PREREG-1052 v3 Amendment 3: the stress map's provisional month to date takes the
    # newest week that day): 10:45 UTC = 05:45 EST / 06:45 EDT
    - cron: '45 10 * * 4'
  pull_request:          # a change to this machinery is checked by a parity run on the pull request (nothing is published from a PR)
    paths: ['ops/live_tools/**', '.github/workflows/live-tools.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: "full (refresh, build, check, publish) | parity (the restored inputs as they are: build and check only, nothing published; outputs as an artifact) | cache-parity (1052 speed: the stress map built with its county layer computed, then taken from the store; every output compared)"
        default: "full"

concurrency:
  # a pull request's parity run publishes nothing: its own group, so a queued main run does not cancel it (15 Nov 2026)
  group: ${{ github.event_name == 'pull_request' && format('live-tools-pr-{0}', github.ref) || 'live-tools' }}
  cancel-in-progress: false

permissions:
  contents: write     # commit the pages; upload the state assets
  actions: write      # start the site deploy (update.yml, mode site)

jobs:
  live-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'parity' || inputs.mode || 'full' }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      # 20 Nov 2026 (the BLS allowance): only a full run on main reads the BLS with the live site's keys; a pull request, a parity or a
      # cache-parity run is a test (BLS_ROLE=test: its own key BLS_API_KEY_TEST, then API v1; s2/bls_fetch.py never reads the production
      # key in a test run). A full run counts its requests in ops/state/bls_usage_live_tools.json, committed at the end of the run, so the
      # 80% alert and the guard's ceiling (s2/bls_fetch.py) see what the live tools spent; the run may make at most BLS_RUN_BUDGET requests
      # on a key (the county LAUS refresh is ~126 of them on its release day) before the chain falls to its next source
      BLS_ROLE: ${{ (github.event_name == 'pull_request' || (inputs.mode || 'full') != 'full') && 'test' || 'production' }}
      BLS_RUN_BUDGET: '200'
    steps:
      - name: where the run keeps its record
        run: |
          echo "LT_OUT=$RUNNER_TEMP/lt_out" >> "$GITHUB_ENV"
          if [ "$BLS_ROLE" = production ]; then echo "BLS_USAGE=$GITHUB_WORKSPACE/ops/state/bls_usage_live_tools.json" >> "$GITHUB_ENV"
          else echo "BLS_USAGE=$RUNNER_TEMP/bls_usage_test.json" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ (github.event_name == 'pull_request' || inputs.mode == 'cache-parity') && github.ref || 'main' }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip                                            # 1052 speed: the Mac's packages from GitHub's cache (about 30 s a run)
          cache-dependency-path: ops/live_tools/requirements.txt

      - uses: actions/setup-node@v5     # check a185 parses the page's scripts with node --check /dev/stdin: the Mac's Node, same version
        with:
          node-version: '26.8.1'

      - name: the Mac's packages, same versions
        run: pip install --quiet --retries 10 --timeout 60 -r ops/live_tools/requirements.txt

      - name: the Mac's folders (the scripts run unchanged at their own paths)
        run: |
          sudo mkdir -p /Users/anthonyhall "/Volumes/Sandisk G" "/Applications/Google Chrome.app/Contents/MacOS"
          sudo chown -R "$(id -u):$(id -g)" /Users/anthonyhall "/Volumes/Sandisk G"
          CH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"; echo "Chrome: $CH"; "$CH" --version
          sudo ln -sf "$CH" "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          git config --global user.name "bristow-hall live tools"; git config --global user.email "noreply@users.noreply.github.com"
          mkdir -p "$LT_OUT"
          # check a185 runs `node --check /dev/stdin`. On Linux /dev/stdin is a pipe that Node cannot resolve as a file (exit 1 for any script;
          # on the Mac it is a file); this shim, first on PATH, hands Node the same text as a file. Every other node call passes through.
          if ( echo 'var a = 1;' | node --check /dev/stdin > /dev/null 2>&1 ); then echo "plain node --check /dev/stdin works"; else echo "plain node --check /dev/stdin fails here (a pipe, ENOENT): the shim is needed"; fi
          mkdir -p "$RUNNER_TEMP/shim"; REAL="$(command -v node)"
          printf '#!/bin/bash\nif [ "$#" = 2 ] && [ "$1" = --check ] && [ "$2" = /dev/stdin ]; then t=$(mktemp --suffix=.js); cat > "$t"; "%s" --check "$t"; rc=$?; rm -f "$t"; exit $rc; fi\nexec "%s" "$@"\n' "$REAL" "$REAL" > "$RUNNER_TEMP/shim/node"
          chmod +x "$RUNNER_TEMP/shim/node"; echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          echo 'var a = 1;' | "$RUNNER_TEMP/shim/node" --check /dev/stdin && echo "node --check /dev/stdin works"

      - name: restore the state (release assets, checksummed)
        run: |
          python3 ops/live_tools/state.py restore
          # the live repository at the Mac clone's path (the stress map reads origin/main's bhs_state.json; the shadow page is written here)
          B="/Users/anthonyhall/Projects/Onset Detector Data/105_bristow_hall_system_2026-09-08"; mkdir -p "$B"; ln -sfn "$GITHUB_WORKSPACE" "$B/cloud"

      # 1052 SPEED, STEP 3 (16 November 2026): the stress map's county layer (23 of its 26 minutes) is stored under the hash of its inputs and
      # code (ops/live_tools/stress_map_cached.py) and taken from the store when they are unchanged - a State, ETA 539 or jobs release
      # leaves them unchanged. The store is kept between runs in GitHub's cache (the newest run's copy is restored).
      - name: the stress map's county layer from the last run (when its inputs are unchanged)
        if: env.MODE == 'full'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/sm_cache
          key: sm-county-${{ github.run_id }}
          restore-keys: sm-county-

      - name: refresh, rebuild and check (ops/live_tools/run_live_tools.sh)
        if: env.MODE != 'cache-parity'
        env:
          BLS_API_KEY: ${{ env.BLS_ROLE == 'production' && secrets.BLS_API_KEY || '' }}
          BLS_API_KEY_2: ${{ env.BLS_ROLE == 'production' && secrets.BLS_API_KEY_2 || '' }}
          BLS_API_KEY_TEST: ${{ env.BLS_ROLE == 'test' && secrets.BLS_API_KEY_TEST || '' }}
          BLS_CONTACT: ${{ secrets.BLS_CONTACT }}
          SM_CACHE_DIR: ${{ runner.temp }}/sm_cache
          SM_CACHE: ${{ env.MODE == 'full' && '1' || '0' }}
        run: bash ops/live_tools/run_live_tools.sh; cat "$LT_OUT/status.json"

      - name: the county layer from the store against the county layer computed (cache-parity)
        if: env.MODE == 'cache-parity'
        run: HOME=/Users/anthonyhall python3 ops/live_tools/sm_cache_parity.py

      - name: parity outputs
        if: env.MODE == 'parity'
        run: |
          cd "$GITHUB_WORKSPACE/data/105_bristow_hall_system_2026-09-08/workspace" && HOME=/Users/anthonyhall python3 s2/tool_inputs_mac.py > "$LT_OUT/tool_inputs.log" 2>&1 || true
          P="/Users/anthonyhall/Projects/Onset Detector Data"; O="$LT_OUT/parity"; mkdir -p "$O"
          cd "$P" && tar -czf "$O/outputs.tar.gz" \
            1032_state_recession_indicator_all_states_dc_2026-11-09/out 1032_state_recession_indicator_all_states_dc_2026-11-09/web/state-onset \
            1052_stress_map_fix_parse_collect_2026-11-12/out 1052_stress_map_fix_parse_collect_2026-11-12/web/stress-map \
            823_live_release_readiness_2026-10-23/out \
            -C "$GITHUB_WORKSPACE" data/105_bristow_hall_system_2026-09-08/site/public/shadow/index.html data/105_bristow_hall_system_2026-09-08/workspace/s2/tool_inputs_mac.json

      - name: put the pages in place (only when every check passed)
        id: pages
        if: env.MODE == 'full'
        env:
          LT_RUNNER: github
        run: |
          OK=$(python3 -c "import json;print(json.load(open('$LT_OUT/status.json'))['state_stress_ok'])")
          SH=$(python3 -c "import json;print(json.load(open('$LT_OUT/status.json'))['shadow_ok'])")
          if [ "$OK" = "True" ]; then HOME=/Users/anthonyhall python3 ops/live_tools/publish_pages.py || OK=False; fi
          echo "pages_ok=$OK" >> "$GITHUB_OUTPUT"; echo "shadow_ok=$SH" >> "$GITHUB_OUTPUT"

      # THE SOURCE GATE (15 November 2026, collection 1052): the State and stress-map pages just put in place are checked against the
      # publishers (each State's newest unemployment rate and claims week on FRED, the BLS county file, QCEW) before anything is committed:
      # a phantom month, a stale month or a stale carried week stops the commit (and so the deploy) in hold mode (ops/source_gate.json).
      - name: the pages against their sources (the source gate)
        id: srcgate
        if: env.MODE == 'full' && steps.pages.outputs.pages_ok == 'True'
        working-directory: data/105_bristow_hall_system_2026-09-08/workspace
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ env.BLS_ROLE == 'production' && secrets.BLS_API_KEY || '' }}
          BLS_API_KEY_2: ${{ env.BLS_ROLE == 'production' && secrets.BLS_API_KEY_2 || '' }}
          BLS_API_KEY_TEST: ${{ env.BLS_ROLE == 'test' && secrets.BLS_API_KEY_TEST || '' }}
          BLS_CONTACT: ${{ secrets.BLS_CONTACT }}
          ALERT_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          python3 s2/source_gate.py --site ../site/public --pages state,stress --out "$LT_OUT/source_gate_report.json" --no-verified-write 2>&1 | tee "$LT_OUT/source_gate.log"; rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then bash s2/alert.sh "HOLD" "live tools held by the source gate: $(grep -m1 '^HOLD' "$LT_OUT/source_gate.log" | cut -c1-300)"; fi
          exit $rc

      - name: commit to main (only what passed and changed)
        id: commit
        if: env.MODE == 'full'
        run: |
          cp ops/state/bls_usage_live_tools.json "$LT_OUT/" 2>/dev/null || true     # the run's BLS count, before the tree is put back (kept by the last step)
          WS=data/105_bristow_hall_system_2026-09-08/workspace; SITE=data/105_bristow_hall_system_2026-09-08/site
          if [ "${{ steps.pages.outputs.pages_ok }}" = "True" ]; then
            git add -A $WS/s2/state_onset $WS/s2/stress_map $SITE/public/state-onset $SITE/public/stress-map $WS/s2/tool_inputs_mac.json
          fi
          if [ "${{ steps.pages.outputs.shadow_ok }}" = "True" ]; then git add -A $SITE/public/shadow/index.html; fi
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)     # live_union_823's own commit of the shadow page
          if git diff --cached --quiet && [ "$AHEAD" = "0" ]; then echo "nothing changed"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --cached --quiet || git commit -q -m "Live tools rebuilt on GitHub (1052 live-tools.yml): $(git diff --cached --name-only | sed -E 's#.*/(state_onset|stress_map|state-onset|stress-map|shadow)/.*#\1#;s#.*/tool_inputs_mac.json#data-page rows#' | sort -u | tr '\n' ' ')"
          git checkout -q -- . 2>/dev/null || true; git clean -fdq -- data 2>/dev/null || true
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 20; done
          git fetch -q origin main; [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "not pushed"; exit 1; }
          echo "pushed=true" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; git log -1 --stat | head -20

      - name: deploy the site (update.yml, mode site) and wait for it
        id: deploy
        if: env.MODE == 'full' && steps.commit.outputs.pushed == 'true'
        run: |
          T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=site -f origin=hand
          for i in $(seq 1 60); do
            sleep 20
            RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --event workflow_dispatch -L 5 --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$T0\")][-1].databaseId")
            [ -n "$RID" ] && break
          done
          echo "update run $RID"; echo "run=$RID" >> "$GITHUB_OUTPUT"
          SHA="${{ steps.commit.outputs.sha }}"
          # The site deploy is done when ANY update.yml run on main that started after our dispatch and whose commit contains ours ($SHA, or a later
          # commit of main) has finished with success. A push by another chat queues a newer update run, which cancels our pending dispatch
          # (concurrency group 'update'); that newer run deploys our pages too, so it counts (15 Nov 2026, run 43756722308 / 43759507101).
          python3 - "$SHA" "$T0" "$RID" <<'PY'
          import json, subprocess, sys, time
          sha, t0, rid = sys.argv[1:4]; R = __import__('os').environ['GITHUB_REPOSITORY']
          gh = lambda *a: subprocess.run(['gh', *a], capture_output=True, text=True).stdout
          def contains(head):
              if head == sha: return True
              try: return json.loads(gh('api', f'repos/{R}/compare/{sha}...{head}')).get('status') in ('identical', 'ahead')
              except Exception: return False
          end = time.time() + 45 * 60
          while time.time() < end:
              runs = json.loads(gh('run', 'list', '-R', R, '--workflow', 'update.yml', '--branch', 'main', '-L', '20', '--json', 'databaseId,status,conclusion,headSha,createdAt') or '[]')
              runs = [r for r in runs if r['createdAt'] >= t0]
              good = [r for r in runs if r['status'] == 'completed' and r['conclusion'] == 'success' and contains(r['headSha'])]
              if good: print('deploy ok: update run %s (commit %s) contains %s' % (good[0]['databaseId'], good[0]['headSha'][:8], sha[:8])); sys.exit(0)
              live = [r for r in runs if r['status'] != 'completed']
              mine = [r for r in runs if str(r['databaseId']) == rid]
              if mine and mine[0]['status'] == 'completed' and mine[0]['conclusion'] not in ('success', 'cancelled') and not live:
                  print('the site deploy failed: run %s %s' % (rid, mine[0]['conclusion'])); sys.exit(1)
              time.sleep(30)
          print('no update run containing %s finished with success in 45 minutes' % sha[:8]); sys.exit(1)
          PY

      - name: read the live pages back
        if: env.MODE == 'full' && steps.deploy.outcome == 'success'
        run: |
          W="stress scale state data cards"; [ "${{ steps.pages.outputs.pages_ok }}" = "True" ] || W="data cards"
          [ "${{ steps.pages.outputs.shadow_ok }}" = "True" ] && W="$W shadow"
          HOME=/Users/anthonyhall python3 ops/live_tools/readback.py $W

      - name: keep the state (new and refreshed inputs, add-only release asset)
        if: always() && env.MODE == 'full'
        run: |
          if [ -f "$LT_OUT/restored.json" ]; then python3 ops/live_tools/state.py delta; else echo "the state was not restored, nothing to keep"; fi

      # 20 Nov 2026: the live tools' BLS requests, kept on main (their own file: update.yml writes bls_usage.json, so the two never collide),
      # so the next run of any job counts them toward the 80% alert and the guard's ceiling (s2/bls_fetch.py). Never fails the run.
      - name: keep the BLS request count (ops/state/bls_usage_live_tools.json)
        if: always() && env.MODE == 'full'
        continue-on-error: true
        run: |
          F=ops/state/bls_usage_live_tools.json; SRC="$LT_OUT/bls_usage_live_tools.json"; [ -f "$SRC" ] || SRC="$GITHUB_WORKSPACE/$F"
          [ -f "$SRC" ] || { echo "no BLS request counted in this run"; exit 0; }
          cp "$SRC" "$RUNNER_TEMP/bls_usage_keep.json"; cat "$RUNNER_TEMP/bls_usage_keep.json"
          W="$RUNNER_TEMP/usage_wt"; git fetch -q origin main && git worktree add -q --detach "$W" origin/main && cd "$W"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 data/105_bristow_hall_system_2026-09-08/workspace/s2/bls_fetch.py keep "$RUNNER_TEMP/bls_usage_keep.json" "$F"
            git add "$F"; git diff --cached --quiet && { echo "the count on main is current"; exit 0; }
            git commit -q -m "BLS requests of the live tools, run ${{ github.run_id }} (ops/state/bls_usage_live_tools.json)" && git push -q origin HEAD:main && { echo "kept"; exit 0; }
            sleep 15
          done
          echo "the count was not kept"; exit 1

      - name: the run's record
        if: always()
        uses: actions/upload-artifact@v7   # 1166: Node 24 (v4 ran on Node 20)
        with:
          name: live-tools-${{ env.MODE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lt_out
            !${{ runner.temp }}/lt_out/assets
          retention-days: 90
          if-no-files-found: warn

      - name: a parity run fails when a check failed
        if: env.MODE == 'parity'
        run: python3 -c "import json,sys;s=json.load(open('$LT_OUT/status.json'));print(s);sys.exit(0 if s['state_stress_ok'] and s['shadow_ok'] else 1)"

      - name: fail the run when the pages were held
        if: env.MODE == 'full' && (steps.pages.outputs.pages_ok != 'True' || steps.pages.outputs.shadow_ok != 'True')
        run: cat "$LT_OUT/status.json" "$LT_OUT/publish_pages.json" 2>/dev/null; tail -40 "$LT_OUT/run.log"; exit 1
