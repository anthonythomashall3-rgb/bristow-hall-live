name: speed parity (1052)
# The speed program's parity proofs (1052, 15 November 2026; Anthony: "the live page to update at MAXIMUM within 5 minutes"). Every
# speed-up must give byte-identical outputs to the path it replaces on the same inputs before it replaces it. Runs on a pull request
# that touches the speed code, and by hand. Publishes nothing, commits nothing. FRED blocks the Mac's address, so it runs here.
on:
  pull_request:
    paths:
      - 'ops/speed/**'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/publisher_first.py'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/bls_fetch.py'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/disturbance/fred_refresh.py'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/source_gate.py'
      - '.github/workflows/speed-parity.yml'
      - 'ops/live_tools/state_fast*.py'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/home_tiles.py'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/second_source.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speed-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 20 Nov 2026: a test never spends the live site's BLS allowance. These runs read the BLS through their own key (BLS_API_KEY_TEST,
    # counted as bls_v2_test in the run's own file), then API v1; the production keys BLS_API_KEY and BLS_API_KEY_2 are not in this
    # workflow at all, and s2/bls_fetch.py refuses to read them in a test run (BLS_ROLE=test; also on any pull request). On 19 Nov six
    # runs of this workflow (about 57 requests each on the production key) ran the key out at 19:10 ET, and the 20 Nov State release
    # waited for FRED.
    env:
      BLS_ROLE: test
      BLS_API_KEY_TEST: ${{ secrets.BLS_API_KEY_TEST }}
      BLS_RUN_BUDGET: '90'
    steps:
      - name: the run's own BLS count (never the live site's files)
        run: echo "BLS_USAGE=$RUNNER_TEMP/bls_usage_test.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: install
        run: pip install --quiet --retries 10 --timeout 60 -r requirements.txt
      - name: the publisher's first print against the FRED path, byte for byte
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python3 ops/speed/parity_publisher_first.py
      - name: the release-time probes and the State first-print capture answer (smoke test; nothing kept)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd data/105_bristow_hall_system_2026-09-08/workspace
          python3 -c "import sys;sys.path.insert(0,'s2');import publisher_first as p;[print(g, f()) for g, f in p.WAIT_ONLY.items()];print('fred:GDPNOW (posted 9 Nov 12:02)', p._probe_fred('fred:GDPNOW:202611091202'));print('fred:GDPNOW (a release in 2030)', p._probe_fred('fred:GDPNOW:203001021202'))"
          cd "$GITHUB_WORKSPACE" && python3 ops/speed/state_first_prints.py --force && head -3 data/state_industry_first_prints/sm_first_prints.csv && wc -l data/state_industry_first_prints/sm_first_prints.csv
      - name: the State inputs from the BLS API against FRED's fredgraph files, series by series
        if: always()
        run: python3 ops/live_tools/state_fast_parity.py
      - name: the source gate with its prefetch against the gate as it runs today, check for check
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # three gates under the shared FRED key: run only when the gate itself changed (it slows every other job's FRED reads)
          git fetch -q --depth 50 origin main || true
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --name-only origin/main...HEAD 2>/dev/null | grep -q 'source_gate.py'; then
            echo "source_gate.py unchanged in this pull request: the gate parity is not rerun"; exit 0; fi
          python3 ops/speed/parity_source_gate.py
      - name: the disturbance series from their publishers on a release day against FRED, and the 17 Nov replay
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python3 ops/speed/parity_disturbance_overlay.py
      - name: the BLS fallbacks against the BLS API, series by series (only when the shared BLS layer changes)
        if: always()
        env:
          BLS_CONTACT: ${{ secrets.BLS_CONTACT }}
          BLS_PARITY_OUT: ops/speed/out/bls_fallback_parity.json
        run: |
          git fetch -q --depth 50 origin main || true
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --name-only origin/main...HEAD 2>/dev/null | grep -q 'bls_fetch.py'; then
            echo "bls_fetch.py unchanged: the BLS fallback parity is not rerun"; exit 0; fi
          mkdir -p ops/speed/out && python3 data/105_bristow_hall_system_2026-09-08/workspace/s2/bls_fetch.py parity
      - name: the BLS allowance guard (no request to the BLS; a stand-in API)
        if: always()
        run: python3 ops/speed/bls_guard_selftest.py
      - name: the run's BLS requests
        if: always()
        run: |
          mkdir -p ops/speed/out
          if [ -f "$BLS_USAGE" ]; then cp "$BLS_USAGE" ops/speed/out/bls_usage_test.json; cat "$BLS_USAGE"; else echo "no BLS API request in this run"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-publisher-first
          path: ops/speed/out/
