name: speed parity (1052)
# The speed program's parity proofs (1052, 15 November 2026; Anthony: "the live page to update at MAXIMUM within 5 minutes"). Every
# speed-up must give byte-identical outputs to the path it replaces on the same inputs before it replaces it. Runs on a pull request
# that touches the speed code, and by hand. Publishes nothing, commits nothing. FRED blocks the Mac's address, so it runs here.
on:
  pull_request:
    paths:
      - 'ops/speed/**'
      - 'data/105_bristow_hall_system_2026-09-08/workspace/s2/publisher_first.py'
      - '.github/workflows/speed-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speed-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: install
        run: pip install --quiet --retries 10 --timeout 60 -r requirements.txt
      - name: the publisher's first print against the FRED path, byte for byte
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python3 ops/speed/parity_publisher_first.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-publisher-first
          path: ops/speed/out/
